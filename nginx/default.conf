# Reverse proxy: one public entry point, two private upstreams.
#   /api/*  -> api:3000  (Express)
#   /*      -> web:8080  (React build served by nginx)

# Docker's embedded DNS. Using it together with variables in proxy_pass makes
# nginx re-resolve service names, so it survives container restarts (new IPs).
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name _;
    server_tokens off;
    client_max_body_size 1m;

    # Used by the Docker healthcheck. Not logged, to keep logs readable.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        set $api_upstream http://api:3000;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location / {
        set $web_upstream http://web:8080;
        proxy_pass $web_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
