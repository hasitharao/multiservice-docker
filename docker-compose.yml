# Multi-service app: React (web) + Express (api) + MongoDB + Redis + Nginx (proxy)
name: multiservice

# ---------------------------------------------------------------------------
# Logging: every service shares this block (YAML anchor).
# json-file keeps logs on the host; max-size/max-file = LOG ROTATION.
# Worst case per container: 3 files x 10 MB = 30 MB, then the oldest is dropped.
# ---------------------------------------------------------------------------
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"
    compress: "true"

services:
  # -------------------------------------------------------------------------
  # Custom base images. They are only BUILT (profile "base"), never run.
  # Build them first:  docker compose --profile base build api-base web-base
  # -------------------------------------------------------------------------
  api-base:
    profiles: ["base"]
    build:
      context: ./base-images/api
    image: multiservice/api-base:1.0

  web-base:
    profiles: ["base"]
    build:
      context: ./base-images/web
    image: multiservice/web-base:1.0

  # -------------------------------------------------------------------------
  # Reverse proxy: the ONLY service published to the host.
  # -------------------------------------------------------------------------
  proxy:
    image: nginx:1.28-alpine
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy
    networks: [frontend]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    logging: *default-logging

  # -------------------------------------------------------------------------
  # Web: React build served by nginx (multi-stage build, see web/Dockerfile).
  # Its HEALTHCHECK is defined inside the Dockerfile.
  # -------------------------------------------------------------------------
  web:
    build:
      context: ./web
      args:
        WEB_BASE_IMAGE: multiservice/web-base:1.0
    image: multiservice/web:1.0
    networks: [frontend]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    logging: *default-logging

  # -------------------------------------------------------------------------
  # API: Node.js + Express. Secrets are read from files, never from env values.
  # Its HEALTHCHECK is defined inside the Dockerfile.
  # -------------------------------------------------------------------------
  api:
    build:
      context: ./api
      args:
        BASE_IMAGE: multiservice/api-base:1.0
    image: multiservice/api:1.0
    environment:
      PORT: "3000"
      MONGO_HOST: mongo
      MONGO_USER: ${MONGO_ROOT_USER:-admin}
      MONGO_PASSWORD_FILE: /run/secrets/mongo_root_password
      REDIS_HOST: redis
      REDIS_PASSWORD_FILE: /run/secrets/redis_password
    secrets:
      - mongo_root_password
      - redis_password
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [frontend, backend]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    logging: *default-logging

  # -------------------------------------------------------------------------
  # MongoDB: data lives in a named volume so it survives `docker compose down`.
  # -------------------------------------------------------------------------
  mongo:
    image: mongo:8.0
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD_FILE: /run/secrets/mongo_root_password
    secrets:
      - mongo_root_password
    volumes:
      - mongo_data:/data/db
      - mongo_config:/data/configdb
    networks: [backend]
    healthcheck:
      # $$ = a literal $ (Compose would otherwise try to substitute it)
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet
          -u "$$MONGO_INITDB_ROOT_USERNAME"
          -p "$$(cat /run/secrets/mongo_root_password)"
          --authenticationDatabase admin
          --eval "db.adminCommand('ping').ok" | grep -q 1
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    logging: *default-logging

  # -------------------------------------------------------------------------
  # Redis: password-protected, append-only persistence in a named volume.
  # The official image has no *_FILE support, so the command reads the secret.
  # `gosu redis` drops root -> redis user after the secret has been read.
  # volatile-lru = when memory is full, only evict keys that have a TTL.
  # -------------------------------------------------------------------------
  redis:
    image: redis:7.4-alpine
    entrypoint:
      - sh
      - -c
      - >-
        exec docker-entrypoint.sh redis-server
        --requirepass "$$(cat /run/secrets/redis_password)"
        --appendonly yes
        --maxmemory 128mb
        --maxmemory-policy volatile-lru
    secrets:
      - redis_password
    volumes:
      - redis_data:/data
    networks: [backend]
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          REDISCLI_AUTH="$$(cat /run/secrets/redis_password)"
          redis-cli ping | grep -q PONG
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    logging: *default-logging

# ---------------------------------------------------------------------------
# Networks: `backend` is internal -> mongo and redis can't reach the internet
# and can't be reached from outside. Only the API sits on both networks.
# ---------------------------------------------------------------------------
networks:
  frontend:
  backend:
    internal: true

volumes:
  mongo_data:
  mongo_config:
  redis_data:

# ---------------------------------------------------------------------------
# Secrets: mounted read-only at /run/secrets/<name> inside the containers.
# Create the files with:  sh scripts/generate-secrets.sh
# ---------------------------------------------------------------------------
secrets:
  mongo_root_password:
    file: ./secrets/mongo_root_password.txt
  redis_password:
    file: ./secrets/redis_password.txt
